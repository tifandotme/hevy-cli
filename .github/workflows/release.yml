name: Release

on:
  push:
    branches: [master]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Cache Bun
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true

      - name: Upgrade npm for OIDC trusted publishing
        run: |
          bun add -g npm@11
          echo "registry=https://registry.npmjs.org/" > ~/.npmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker isolated

      - name: Run checks
        run: |
          bun run format:check
          bun run lint
          bun run typecheck
          bun test
          bun run build

      - name: Test packed CLI install
        run: |
          pack_dir=$(mktemp -d)
          install_dir=$(mktemp -d)
          npm pack --pack-destination "${pack_dir}"
          npm install --prefix "${install_dir}" "${pack_dir}"/*.tgz
          "${install_dir}/node_modules/.bin/hevy" --help

      - name: Create Release Pull Request or Publish
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun run version
          publish-script: bun run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
